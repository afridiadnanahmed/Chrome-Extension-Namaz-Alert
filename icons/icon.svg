<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8960c"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="#ffd700" stroke-width="2"/>

  <!-- Main dome -->
  <path d="M64 25 Q44 25 38 50 L38 85 L90 85 L90 50 Q84 25 64 25" fill="url(#goldGrad)"/>

  <!-- Dome top crescent -->
  <circle cx="64" cy="22" r="5" fill="#ffd700"/>
  <circle cx="66" cy="22" r="4" fill="#1a1a1a"/>

  <!-- Center minaret -->
  <rect x="60" y="15" width="8" height="12" fill="url(#goldGrad)"/>

  <!-- Left minaret -->
  <rect x="28" y="40" width="8" height="55" fill="url(#goldGrad)"/>
  <path d="M32 40 Q26 40 26 48 L26 40 Q26 32 32 32 Q38 32 38 40 L38 48 Q38 40 32 40" fill="url(#goldGrad)"/>
  <circle cx="32" cy="30" r="3" fill="#ffd700"/>
  <circle cx="33.5" cy="30" r="2.5" fill="#1a1a1a"/>

  <!-- Right minaret -->
  <rect x="92" y="40" width="8" height="55" fill="url(#goldGrad)"/>
  <path d="M96 40 Q90 40 90 48 L90 40 Q90 32 96 32 Q102 32 102 40 L102 48 Q102 40 96 40" fill="url(#goldGrad)"/>
  <circle cx="96" cy="30" r="3" fill="#ffd700"/>
  <circle cx="97.5" cy="30" r="2.5" fill="#1a1a1a"/>

  <!-- Door arch -->
  <path d="M54 85 L54 65 Q54 55 64 55 Q74 55 74 65 L74 85 Z" fill="#1a1a1a"/>

  <!-- Windows -->
  <ellipse cx="45" cy="60" rx="4" ry="6" fill="#1a1a1a"/>
  <ellipse cx="83" cy="60" rx="4" ry="6" fill="#1a1a1a"/>

  <!-- Base -->
  <rect x="25" y="85" width="78" height="8" fill="url(#goldGrad)"/>

  <!-- Stars decoration -->
  <polygon points="20,18 21,21 24,21 22,23 23,26 20,24 17,26 18,23 16,21 19,21" fill="#ffd700" opacity="0.6"/>
  <polygon points="108,18 109,21 112,21 110,23 111,26 108,24 105,26 106,23 104,21 107,21" fill="#ffd700" opacity="0.6"/>
</svg>
