<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Namaz Timings</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Namaz Timings</h1>
      <div id="location-info">
        <span id="city">Loading...</span>
      </div>
      <div id="date-info">
        <span id="gregorian-date"></span>
        <span id="hijri-date"></span>
      </div>
    </header>

    <main>
      <section class="prayer-section">
        <h2>Prayer Times</h2>
        <div id="prayer-times">
          <div class="prayer-card" data-prayer="fajr">
            <div class="prayer-icon">🌙</div>
            <div class="prayer-info">
              <span class="prayer-name">Fajr</span>
              <span class="prayer-time" id="fajr">--:--</span>
            </div>
            <div class="prayer-status"></div>
          </div>
          <div class="prayer-card" data-prayer="sunrise">
            <div class="prayer-icon">🌅</div>
            <div class="prayer-info">
              <span class="prayer-name">Sunrise</span>
              <span class="prayer-time" id="sunrise">--:--</span>
            </div>
            <div class="prayer-status"></div>
          </div>
          <div class="prayer-card" data-prayer="dhuhr">
            <div class="prayer-icon">☀️</div>
            <div class="prayer-info">
              <span class="prayer-name">Dhuhr</span>
              <span class="prayer-time" id="dhuhr">--:--</span>
            </div>
            <div class="prayer-status"></div>
          </div>
          <div class="prayer-card" data-prayer="asr">
            <div class="prayer-icon">🌤️</div>
            <div class="prayer-info">
              <span class="prayer-name">Asr</span>
              <span class="prayer-time" id="asr">--:--</span>
            </div>
            <div class="prayer-status"></div>
          </div>
          <div class="prayer-card" data-prayer="maghrib">
            <div class="prayer-icon">🌇</div>
            <div class="prayer-info">
              <span class="prayer-name">Maghrib</span>
              <span class="prayer-time" id="maghrib">--:--</span>
            </div>
            <div class="prayer-status"></div>
          </div>
          <div class="prayer-card" data-prayer="isha">
            <div class="prayer-icon">🌃</div>
            <div class="prayer-info">
              <span class="prayer-name">Isha</span>
              <span class="prayer-time" id="isha">--:--</span>
            </div>
            <div class="prayer-status"></div>
          </div>
        </div>
        <div id="next-prayer-countdown">
          <span>Next Prayer: </span>
          <span id="next-prayer-name">--</span>
          <span> in </span>
          <span id="countdown-timer">--:--:--</span>
        </div>
      </section>

      <section class="dua-section">
        <h2>Dua for This Time</h2>
        <div id="dua-container">
          <p class="dua-arabic" id="dua-arabic"></p>
          <p class="dua-transliteration" id="dua-transliteration"></p>
          <p class="dua-translation" id="dua-translation"></p>
        </div>
        <div class="dua-navigation">
          <button id="prev-dua" class="dua-btn">&larr; Previous</button>
          <span id="dua-counter">1/3</span>
          <button id="next-dua" class="dua-btn">Next &rarr;</button>
        </div>
      </section>

      <section class="allah-names-section">
        <h2>99 Names of Allah</h2>
        <div id="allah-name-container">
          <span class="name-number" id="name-number">1</span>
          <p class="name-arabic" id="name-arabic"></p>
          <p class="name-transliteration" id="name-transliteration"></p>
          <p class="name-meaning" id="name-meaning"></p>
        </div>
        <div class="name-progress">
          <div class="progress-bar" id="name-progress-bar"></div>
        </div>
      </section>
    </main>

    <footer>
      <button id="settings-btn">Settings</button>
    </footer>
  </div>

  <script src="data/allah-names.js"></script>
  <script src="data/duas.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
